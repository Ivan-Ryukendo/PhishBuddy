<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhishBuddy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>PhishBuddy</h1>
      </header>

      <form id="check-form" class="panel">
        <label for="url-input">URL</label>
        <input id="url-input" type="url" placeholder="https://example.com" required>
        <button type="submit">Check URL</button>
      </form>

      <section id="result" class="verdict verdict-idle" aria-live="polite"></section>

      <form id="api-form" class="panel settings">
        <label for="api-base-url">API base URL</label>
        <input id="api-base-url" type="url" required>
        <div class="row">
          <button type="submit">Save</button>
          <span id="save-status" role="status"></span>
        </div>
      </form>
    </main>

    <script src="src/config.js"></script>
    <script src="src/apiClient.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/popup.js"></script>
  </body>
</html>
