<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhishBuddy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true">PB</span>
          <div>
            <h1>PhishBuddy</h1>
            <p id="current-domain">Checking current tab</p>
          </div>
        </div>
        <a class="icon-link" href="https://github.com/Ivan-Ryukendo/PhishBuddy" target="_blank" rel="noreferrer" title="Open GitHub repository" aria-label="Open GitHub repository">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0.2A7.9 7.9 0 0 0 5.5 15.6c0.4 0.1 0.5-0.2 0.5-0.4v-1.4c-2.1 0.5-2.6-0.9-2.6-0.9-0.4-0.9-0.9-1.1-0.9-1.1-0.7-0.5 0.1-0.5 0.1-0.5 0.8 0.1 1.2 0.8 1.2 0.8 0.7 1.2 1.9 0.9 2.3 0.7 0.1-0.5 0.3-0.9 0.5-1.1-1.7-0.2-3.5-0.9-3.5-3.9 0-0.9 0.3-1.6 0.8-2.1-0.1-0.2-0.4-1 0.1-2.1 0 0 0.7-0.2 2.2 0.8A7.6 7.6 0 0 1 8 4.1c0.7 0 1.3 0.1 1.9 0.3 1.5-1 2.2-0.8 2.2-0.8 0.5 1.1 0.2 1.9 0.1 2.1 0.5 0.6 0.8 1.3 0.8 2.1 0 3-1.8 3.7-3.5 3.9 0.3 0.2 0.5 0.7 0.5 1.4v2.1c0 0.2 0.1 0.5 0.5 0.4A7.9 7.9 0 0 0 8 0.2z"></path>
          </svg>
        </a>
      </header>

      <section id="result" class="verdict verdict-idle" aria-live="polite"></section>

      <div class="actions">
        <button id="manual-toggle" type="button" class="secondary">Check different site</button>
      </div>

      <form id="check-form" class="manual-check" hidden>
        <label for="url-input">URL</label>
        <div class="input-row">
          <input id="url-input" type="url" placeholder="https://example.com" required>
          <button type="submit">Check</button>
        </div>
      </form>
    </main>

    <script src="src/config.js"></script>
    <script src="src/apiClient.js"></script>
    <script src="src/pageRisk.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/popup.js"></script>
  </body>
</html>
