<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhishBuddy settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>PhishBuddy settings</h1>
      </header>
      <form id="options-form" class="panel">
        <label for="api-base-url">API base URL</label>
        <input id="api-base-url" type="url" required>
        <button type="submit">Save settings</button>
        <span id="options-status" role="status"></span>
      </form>
    </main>

    <script src="src/config.js"></script>
    <script src="src/options.js"></script>
  </body>
</html>
